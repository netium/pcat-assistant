[project]
name = "pipecat-quickstart"
version = "0.1.0"
description = "Voice AI bot built with Pipecat"
requires-python = ">=3.11"
dependencies = [
    "loguru>=0.7.3",
    "pipecat-ai[cartesia,daily,deepgram,mlx-whisper,mlx-whisper-whisper,nvidia,openai,pocket-tts,runner,silero,webrtc,whisper]>=1.12.0",
    "pipecatcloud",
    "tavily-python>=0.8.5",
]

[dependency-groups]
dev = [
    "pyright>=1.1.414,<2",
    "ruff>=0.17.0,<1",
]

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["I", "UP"]
