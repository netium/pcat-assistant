[project]
name = "pipecat-quickstart"
version = "0.1.0"
description = "Voice AI bot built with Pipecat"
requires-python = ">=3.11"
dependencies = [
    "loguru>=0.7.3",
    "pipecat-ai[cartesia,daily,deepgram,openai,runner,silero,webrtc]>=1.4.0",
    "pipecatcloud",
    "tavily-python>=0.7.26",
]

[dependency-groups]
dev = [
    "pyright>=1.1.404,<2",
    "ruff>=0.12.11,<1",
]

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["I", "UP"]
